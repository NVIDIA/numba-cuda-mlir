name: Install dependencies on Ubuntu

description: Install needed dependencies, regardless if using GitHub- or self- hosted runners, container, sudo or not.

inputs:
  dependencies:
    required: true
    type: string
  dependent_exes:
    required: true
    type: string

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash --noprofile --norc -xeuo pipefail {0}
      run: |
        dependencies=(${{ inputs.dependencies }})
        dependent_exes=(${{ inputs.dependent_exes }})

        if ! (command -v sudo 2>&1 >/dev/null); then
          if [[ $EUID == 0 ]]; then
            alias SUDO=""
          else
            echo "The following operations require root access."
            exit 1
          fi
        else
          alias SUDO="sudo"
        fi
        shopt -s expand_aliases

        # Always refresh the system trust store before anything else: pip 24.2+
        # trusts certifi plus the OpenSSL default store additively, so a stale
        # ca-certificates package can keep the compromised eMudhra/emSign
        # intermediates trusted even when every requested exe below is already
        # present (which short-circuits the rest of this step).
        # See https://discuss.python.org/t/109576.
        SUDO apt update
        SUDO apt install -y ca-certificates

        # Explicitly distrust the compromised eMudhra/emSign root CAs. Keeping
        # the apt install above picks up a future Ubuntu security update that
        # removes them from the shipped bundle, but today Ubuntu 22.04 has not
        # published a fixed ca-certificates build, so the apt install is a
        # no-op there and the roots remain trusted. Prefixing the entry in
        # /etc/ca-certificates.conf with '!' deactivates the cert; the
        # grep guard makes this a no-op when the entry is already absent or
        # already deactivated.
        _ca_changed=0
        for cert in \
            "mozilla/emSign_ECC_Root_CA_-_G3.crt" \
            "mozilla/emSign_Root_CA_-_G1.crt"; do
          if grep -qxF "${cert}" /etc/ca-certificates.conf 2>/dev/null; then
            SUDO sed -i "s|^${cert}$|!${cert}|" /etc/ca-certificates.conf
            echo "Distrusted: ${cert}"
            _ca_changed=1
          fi
        done
        if [[ ${_ca_changed} -eq 1 ]]; then
          SUDO update-ca-certificates
        fi

        not_found=0
        for dep in ${dependent_exes[@]}; do
          if ! (command -v $dep 2>&1 >/dev/null); then
            not_found=1
            break
          fi
        done
        if [[ $not_found == 0 ]]; then
          echo "All other dependencies are found. Done."
          exit 0
        fi
        SUDO apt install -y ${dependencies[@]}
