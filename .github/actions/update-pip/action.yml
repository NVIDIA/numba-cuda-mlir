name: Update pip
description: >-
  Assert that the interpreter's ssl module blocks the compromised
  eMudhra/emSign CAs, then upgrade pip to the latest release.
  The assertion catches regressions if the python-version spec in the calling
  workflow ever drifts below the required patch. Use a tilde-range spec
  (e.g. python-version: '~3.13.18') so setup-python enforces the floor while
  automatically picking up newer security patches. Operates on the `python`
  found on PATH; optionally verifies it is the expected virtualenv interpreter.
  See https://discuss.python.org/t/109576

inputs:
  python-path:
    description: Expected virtualenv interpreter; omit to check only the security release floor.
    default: ""

runs:
  using: composite
  steps:
    - name: Assert Python blocks compromised CAs
      shell: python {0}
      env:
        ACTION_PATH: ${{ github.action_path }}
        PYTHON: ${{ inputs.python-path }}
      run: |
        import os
        import runpy
        from pathlib import Path

        root = Path(os.environ["ACTION_PATH"]).parents[2]
        runpy.run_path(str(root / "ci/tools/check_python_security.py"), run_name="__main__")
    - name: Upgrade pip
      shell: bash --noprofile --norc -xeuo pipefail {0}
      run: |
        python -m pip install --disable-pip-version-check --upgrade pip
        python -m pip --version
