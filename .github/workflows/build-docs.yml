name: "CI: Build and update docs"

on:
  workflow_call:
    inputs:
      host-platform:
        description: "Host platform of the wheel artifact to use"
        required: false
        default: "linux-64"
        type: string
      git-tag:
        description: "Target git tag to build docs for"
        required: false
        default: ""
        type: string
      run-id:
        description: "The GHA run ID that generated validated artifacts"
        required: false
        default: ${{ github.run_id }}
        type: string
      is-release:
        description: "Are we building release docs?"
        required: false
        default: false
        type: boolean

defaults:
  run:
    shell: bash --noprofile --norc -xeuo pipefail {0}

permissions:
  actions: read
  contents: write  # required for JamesIves/github-pages-deploy-action to push to gh-pages
  pull-requests: write  # required for sticky PR comment (doc preview link)

jobs:
  build:
    name: Build docs
    # The build stage could fail but we want the CI to keep moving.
    if: ${{ github.repository_owner == 'nvidia' && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      deployment-artifact-name: ${{ steps.deployment-metadata.outputs.deployment-artifact-name }}
      docs-github-ref: ${{ steps.deployment-metadata.outputs.docs-github-ref }}
      pr-number: ${{ steps.deployment-metadata.outputs.pr-number }}
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.git-tag }}

      - name: Harden OS certificate trust
        uses: ./.github/actions/upgrade-ca-certificates

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "~3.12.16"

      - name: Set environment variables
        run: |
          PYTHON_VERSION_FORMATTED="312"
          REPO_DIR=$(pwd)

          if [[ "${{ inputs.is-release }}" == "true" ]]; then
            FILE_HASH="*"
            COMMIT_HASH="${{ inputs.git-tag }}"
          else
            FILE_HASH="${{ github.sha }}"
            COMMIT_HASH="${{ github.sha }}"
          fi

          ARTIFACT_BASENAME="numba-cuda-mlir-python${PYTHON_VERSION_FORMATTED}-${{ inputs.host-platform }}"
          {
            echo "COMMIT_HASH=${COMMIT_HASH}"
            echo "NUMBA_CUDA_MLIR_ARTIFACT_NAME=${ARTIFACT_BASENAME}-${FILE_HASH}"
            echo "NUMBA_CUDA_MLIR_ARTIFACTS_DIR=${REPO_DIR}/dist"
          } >> "$GITHUB_ENV"

      - name: Download numba-cuda-mlir wheel (same-run)
        if: ${{ !inputs.is-release }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ env.NUMBA_CUDA_MLIR_ARTIFACT_NAME }}
          path: ${{ env.NUMBA_CUDA_MLIR_ARTIFACTS_DIR }}

      - name: Download numba-cuda-mlir wheel (release run)
        if: ${{ inputs.is-release }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: ${{ env.NUMBA_CUDA_MLIR_ARTIFACT_NAME }}
          merge-multiple: true
          path: ${{ env.NUMBA_CUDA_MLIR_ARTIFACTS_DIR }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      - name: Display structure of downloaded artifacts
        run: |
          ls -lahR "${NUMBA_CUDA_MLIR_ARTIFACTS_DIR}"

      - name: Update pip
        uses: ./.github/actions/update-pip

      - name: Install docs build dependencies
        run: |
          python -m pip install \
            sphinx \
            numpydoc \
            sphinx-copybutton \
            enum_tools \
            sphinx-toolbox \
            nvidia-sphinx-theme

      - name: Install numba-cuda-mlir wheel
        run: |
          python -m pip install "${NUMBA_CUDA_MLIR_ARTIFACTS_DIR}"/*.whl

      - name: Build docs
        env:
          BUILD_LATEST: ${{ (inputs.is-release && '0') || '1' }}
        run: |
          pushd docs
          if [[ "${{ inputs.is-release }}" == "false" ]]; then
            ./build_docs.sh latest-only
          else
            ./build_docs.sh
            # At release time, we don't want to update the latest docs
            rm -rf build/html/latest
          fi
          ls -l build/html
          popd

      # PR CI uses pull-request/<number> refs regardless of the target branch.
      - name: Get PR number
        if: ${{ !inputs.is-release && startsWith(github.ref_name, 'pull-request/') }}
        uses: ./.github/actions/get_pr_number

      - name: Record deployment metadata
        id: deployment-metadata
        run: |
          echo "deployment-artifact-name=docs-deployment-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "docs-github-ref=${COMMIT_HASH}" >> "$GITHUB_OUTPUT"
          echo "pr-number=${PR_NUMBER:-}" >> "$GITHUB_OUTPUT"

      - name: Upload built docs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: numba-cuda-mlir-docs
          path: docs/build/html/
          retention-days: 7

      - name: Upload docs deployment payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.deployment-metadata.outputs.deployment-artifact-name }}
          path: docs/build/html/
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    name: Deploy docs
    # GitHub discards prerequisite artifacts on a new run attempt. If only this
    # job fails, use "Re-run all jobs" so the build recreates its payload.
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    # Must match every job that writes to gh-pages.
    concurrency:
      group: numba-cuda-mlir-gh-pages-publish
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.git-tag }}

      - name: Download docs deployment payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.build.outputs.deployment-artifact-name }}
          path: docs/build/html/

      - name: Deploy doc preview
        if: ${{ !inputs.is-release && startsWith(github.ref_name, 'pull-request/') }}
        uses: ./.github/actions/doc_preview
        with:
          source-folder: docs/build/html
          pr-number: ${{ needs.build.outputs.pr-number }}

      - name: Deploy docs
        if: ${{ github.ref_name == 'main' || inputs.is-release }}
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445  # v4.9.0
        with:
          folder: docs/build/html/
          target-folder: /
          commit-message: "Deploy ${{ (inputs.is-release && 'release') || 'latest' }} docs: ${{ needs.build.outputs.docs-github-ref }}"
          clean: false
          force: false
