on:
  workflow_call:
    inputs:
      host-platform:
        required: true
        type: string
      python-versions:
        description: JSON array of Python versions (sourced from ci/versions.yml).
        required: true
        type: string

defaults:
  run:
    shell: bash --noprofile --norc -xeuo pipefail {0}

permissions:
  contents: read
  id-token: write

jobs:
  build-llvm-modern:
    name: LLVM Modern (${{ matrix.python-version }})
    if: ${{ startsWith(inputs.host-platform, 'linux') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    runs-on: ${{ (inputs.host-platform == 'linux-64' && 'linux-amd64-cpu8') ||
                 (inputs.host-platform == 'linux-aarch64' && 'linux-arm64-cpu8') }}
    timeout-minutes: 180
    container:
      image: ${{ (inputs.host-platform == 'linux-aarch64' && 'quay.io/pypa/manylinux_2_28_aarch64') ||
                  'quay.io/pypa/manylinux_2_28_x86_64' }}
    env:
      PARALLEL: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Derive the py-tag and manylinux Python interpreter path from
      # matrix.python-version. "3.14t" -> cp314t and cp314-cp314t; "3.11"
      # -> cp311 and cp311-cp311.
      - name: Compute Python tags
        run: |
          PY_VER='${{ matrix.python-version }}'
          BASE_TAG="cp${PY_VER%t}"
          BASE_TAG="${BASE_TAG//./}"
          PY_TAG="cp${PY_VER//./}"
          echo "PY_TAG=$PY_TAG" >> "$GITHUB_ENV"
          echo "PY=/opt/python/${BASE_TAG}-${PY_TAG}/bin/python" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 43200

      - name: Compute cache key
        id: cache-key
        run: |
          KEY="$(bash ci/llvm-cache-key.sh modern "${{ inputs.host-platform }}" "$PY_TAG")"
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"

      - name: Restore or check LLVM Modern GHA cache
        id: gha-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: llvm-modern-install/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Install build dependencies
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$(dirname $PY):$PATH"
          "${PY}" -m pip install pybind11 "nanobind~=2.9" numpy ninja cmake awscli "typing-extensions; python_version < '3.12'"
          chmod +x ci/*.sh

      - name: Install sccache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/rapidsai/sccache/releases/latest/download/sccache-$(uname -m)-unknown-linux-musl.tar.gz" \
            | tar -C /usr/local/bin -xz --strip-components=1 --wildcards '*/sccache'
          sccache --version

      - name: Set up sccache S3 credentials
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$(dirname $PY):$PATH"
          ci/setup-sccache.sh

      - name: Build or restore LLVM Modern from cache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$(dirname $PY):$PATH"
          source ci/llvm-version.env
          CACHE_KEY="${{ steps.cache-key.outputs.key }}"
          echo "Cache key: ${CACHE_KEY}"
          if source ci/llvm-cache.sh && cache_download "$CACHE_KEY" llvm-modern-install; then
            echo "Using cached LLVM"
          else
            ci/build-llvm-modern.sh
            source ci/llvm-cache.sh && cache_upload "$CACHE_KEY" llvm-modern-install
          fi

      - name: Save LLVM Modern to GHA cache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: llvm-modern-install/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Upload LLVM Modern artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: llvm-modern-install-${{ env.PY_TAG }}-${{ inputs.host-platform }}
          path: llvm-modern-install/

  build-llvm-windows:
    name: LLVM ${{ matrix.mode == 'modern' && format('Modern Windows ({0})', matrix.python-version) || '7 Windows' }}
    if: ${{ inputs.host-platform == 'win-64' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
        mode: [modern]
        # The LLVM 7 toolchain is built once at a fixed Python; the Modern
        # rows span python.supported above.
        include:
          - python-version: "3.12"
            mode: llvm7
    runs-on: windows-amd64-cpu16
    timeout-minutes: 120
    env:
      PARALLEL: "16"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 43200

      - name: Compute LLVM params
        id: params
        run: |
          PY_VER='${{ matrix.python-version }}'
          PY_TAG="cp${PY_VER//./}"
          if [[ '${{ matrix.mode }}' == 'modern' ]]; then
            INSTALL_DIR=llvm-modern-install
            CONTAINER_NAME="llvm-modern-$PY_TAG"
            KEY="$(bash ci/llvm-cache-key.sh modern "${{ inputs.host-platform }}" "$PY_TAG")"
            ARTIFACT_NAME="llvm-modern-install-$PY_TAG-${{ inputs.host-platform }}"
          else
            INSTALL_DIR=llvm7-install
            CONTAINER_NAME=llvm7-build
            KEY="$(bash ci/llvm-cache-key.sh llvm7 "${{ inputs.host-platform }}")"
            ARTIFACT_NAME="llvm7-install-${{ inputs.host-platform }}"
          fi
          echo "PY_TAG=$PY_TAG" >> "$GITHUB_ENV"
          echo "INSTALL_DIR=$INSTALL_DIR" >> "$GITHUB_ENV"
          echo "CONTAINER_NAME=$CONTAINER_NAME" >> "$GITHUB_ENV"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "artifact-name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Restore or check LLVM GHA cache
        id: gha-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.INSTALL_DIR }}/
          key: ${{ steps.params.outputs.key }}

      - name: Pull devcontainer image
        if: steps.gha-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          . ./ci/windows-common.ps1
          Import-EnvFile ci/windows-devcontainer.env
          docker pull $env:WINDOWS_DEVCONTAINER_IMAGE

      - name: Build LLVM in devcontainer
        if: steps.gha-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          BUILD_MODE: ${{ matrix.mode }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          . ./ci/windows-common.ps1
          Import-EnvFile ci/windows-devcontainer.env
          $src = (Resolve-Path "${{ github.workspace }}").Path
          $img = $env:WINDOWS_DEVCONTAINER_IMAGE
          $py = $env:PYTHON_VERSION
          $mode = $env:BUILD_MODE
          $cname = $env:CONTAINER_NAME
          docker run --rm --name $cname --isolation=process `
            --mount "type=bind,source=$src,target=C:\workspace" `
            --workdir C:\workspace `
            --env "PARALLEL=${{ env.PARALLEL }}" `
            $img `
            powershell -NoProfile -ExecutionPolicy Bypass -File C:\workspace\ci\windows-llvm-container-build.ps1 -PythonVersion $py -Mode $mode
          if ($LASTEXITCODE -ne 0) {
            throw "$mode LLVM build container failed with exit code $LASTEXITCODE"
          }

      - name: Verify LLVM install
        if: steps.gha-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $install = "${{ github.workspace }}\$env:INSTALL_DIR"
          if (-not (Test-Path $install)) {
            throw "LLVM install not found at $install"
          }

      - name: Save LLVM to GHA cache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.INSTALL_DIR }}/
          key: ${{ steps.params.outputs.key }}

      - name: Upload LLVM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.params.outputs.artifact-name }}
          path: ${{ env.INSTALL_DIR }}/

  build-llvm-windows-arm64:
    name: LLVM Modern Windows Arm64 (Python ${{ matrix.python-version }})
    if: ${{ inputs.host-platform == 'win-arm64' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    runs-on: windows-11-arm
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      PARALLEL: "4"
      LLVM_PARALLEL_LINK_JOBS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Compute cache key
        id: cache-key
        run: |
          PY_TAG="cp$(echo "${{ matrix.python-version }}" | tr -d '.')"
          source ci/llvm-version.env
          echo "msvc-toolset=${LLVM_WINDOWS_ARM64_MSVC_TOOLSET}" >> "$GITHUB_OUTPUT"
          KEY="$(bash ci/llvm-cache-key.sh modern "${{ inputs.host-platform }}" "$PY_TAG")"
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"
          echo "py-tag=${PY_TAG}" >> "$GITHUB_OUTPUT"

      - name: Restore LLVM Modern cache
        id: gha-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: llvm-modern-install/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Set up native Arm Python
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up ARM64 MSVC
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
        with:
          arch: arm64
          toolset: ${{ steps.cache-key.outputs.msvc-toolset }}

      - name: Install build dependencies
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install pybind11 "nanobind~=2.9" numpy ninja cmake "typing-extensions; python_version < '3.12'"

      - name: Build modern LLVM on host
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: bash ci/build-windows.sh modern

      - name: Save LLVM Modern cache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: llvm-modern-install/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Upload LLVM Modern artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: llvm-modern-install-${{ steps.cache-key.outputs.py-tag }}-${{ inputs.host-platform }}
          path: llvm-modern-install/
          if-no-files-found: error

  build-llvm7:
    name: LLVM 7
    if: ${{ startsWith(inputs.host-platform, 'linux') }}
    runs-on: ${{ (inputs.host-platform == 'linux-64' && 'linux-amd64-cpu8') ||
                 (inputs.host-platform == 'linux-aarch64' && 'linux-arm64-cpu8') }}
    timeout-minutes: 180
    container:
      image: ${{ (inputs.host-platform == 'linux-aarch64' && 'quay.io/pypa/manylinux_2_28_aarch64') ||
                  'quay.io/pypa/manylinux_2_28_x86_64' }}
    env:
      PY: /opt/python/cp312-cp312/bin/python
      PARALLEL: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 43200

      - name: Compute cache key
        id: cache-key
        run: |
          KEY="$(bash ci/llvm-cache-key.sh llvm7 "${{ inputs.host-platform }}")"
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"

      - name: Restore or check LLVM 7 GHA cache
        id: gha-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: llvm7-install/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Install build dependencies
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$(dirname $PY):$PATH"
          "${PY}" -m pip install pybind11 "nanobind~=2.9" numpy ninja cmake awscli
          chmod +x ci/*.sh

      - name: Install sccache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/rapidsai/sccache/releases/latest/download/sccache-$(uname -m)-unknown-linux-musl.tar.gz" \
            | tar -C /usr/local/bin -xz --strip-components=1 --wildcards '*/sccache'
          sccache --version

      - name: Set up sccache S3 credentials
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$(dirname $PY):$PATH"
          ci/setup-sccache.sh

      - name: Build or restore LLVM 7 from cache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$(dirname $PY):$PATH"
          source ci/llvm-version.env
          CACHE_KEY="${{ steps.cache-key.outputs.key }}"
          echo "Cache key: ${CACHE_KEY}"
          if source ci/llvm-cache.sh && cache_download "$CACHE_KEY" llvm7-install; then
            echo "Using cached LLVM 7"
          else
            ci/build-llvm7.sh
            source ci/llvm-cache.sh && cache_upload "$CACHE_KEY" llvm7-install
          fi

      - name: Save LLVM 7 to GHA cache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: llvm7-install/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Upload LLVM 7 artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: llvm7-install-${{ inputs.host-platform }}
          path: llvm7-install/
