on:
  workflow_call:
    inputs:
      host-platform:
        required: true
        type: string
      python-versions:
        description: JSON array of Python versions (sourced from ci/versions.yml).
        required: true
        type: string

defaults:
  run:
    shell: bash --noprofile --norc -xeuo pipefail {0}

permissions:
  contents: read
  id-token: write

jobs:
  build-llvm-modern:
    name: LLVM Modern (${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    runs-on: ${{ (inputs.host-platform == 'linux-64' && 'linux-amd64-cpu8') ||
                 (inputs.host-platform == 'linux-aarch64' && 'linux-arm64-cpu8') ||
                 (inputs.host-platform == 'win-64' && 'windows-2022') ||
                 (inputs.host-platform == 'win-arm64' && 'windows-11-arm') }}
    timeout-minutes: 360
    # Linux builds in manylinux for its glibc floor; Windows on the host.
    container: ${{ (inputs.host-platform == 'linux-64' && 'quay.io/pypa/manylinux_2_28_x86_64') ||
                   (inputs.host-platform == 'linux-aarch64' && 'quay.io/pypa/manylinux_2_28_aarch64') || '' }}
    env:
      PARALLEL: "4"
      # One link at a time on the hosted Windows runners, as the WoA build did.
      LLVM_PARALLEL_LINK_JOBS: ${{ startsWith(inputs.host-platform, 'win') && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Compute LLVM params
        id: params
        run: |
          PY_VER='${{ matrix.python-version }}'
          PY_TAG="cp${PY_VER//./}"
          echo "key=$(bash ci/llvm-cache-key.sh modern "${{ inputs.host-platform }}" "$PY_TAG")" >> "$GITHUB_OUTPUT"
          echo "artifact-name=llvm-modern-install-$PY_TAG-${{ inputs.host-platform }}" >> "$GITHUB_OUTPUT"
          source ci/llvm-version.env
          echo "msvc-toolset=${LLVM_WINDOWS_MSVC_TOOLSET}" >> "$GITHUB_OUTPUT"

      - name: Restore or check LLVM GHA cache
        id: gha-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: llvm-modern-install/
          key: ${{ steps.params.outputs.key }}

      - name: Set up Python
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-hardened-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up MSVC
        if: ${{ steps.gha-cache.outputs.cache-hit != 'true' && startsWith(inputs.host-platform, 'win') }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
        with:
          arch: ${{ inputs.host-platform == 'win-arm64' && 'arm64' || 'x64' }}
          toolset: ${{ steps.params.outputs.msvc-toolset }}

      - name: Install build dependencies
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install pybind11 "nanobind~=2.9" numpy ninja cmake "typing-extensions; python_version < '3.12'"
          # ci/llvm-cache.sh needs the AWS CLI; the Windows runner images ship it.
          if [[ "${RUNNER_OS}" == Linux ]]; then
            python -m pip install awscli
          fi

      - name: Install sccache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-sccache

      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.gha-cache.outputs.cache-hit != 'true'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 43200

      - name: Set up sccache S3 credentials
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: bash ci/setup-sccache.sh

      - name: Build or restore LLVM from cache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          CACHE_KEY="${{ steps.params.outputs.key }}"
          echo "Cache key: ${CACHE_KEY}"
          if source ci/llvm-cache.sh && cache_download "$CACHE_KEY" llvm-modern-install; then
            echo "Using cached LLVM"
          else
            bash ci/build-llvm-modern.sh
            source ci/llvm-cache.sh && cache_upload "$CACHE_KEY" llvm-modern-install
          fi

      - name: Save LLVM to GHA cache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: llvm-modern-install/
          key: ${{ steps.params.outputs.key }}

      - name: Upload LLVM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.params.outputs.artifact-name }}
          path: llvm-modern-install/
          if-no-files-found: error

  build-llvm7:
    name: LLVM 7
    # WoA has no LLVM 7 bridge.
    if: ${{ inputs.host-platform != 'win-arm64' }}
    runs-on: ${{ (inputs.host-platform == 'linux-64' && 'linux-amd64-cpu8') ||
                 (inputs.host-platform == 'linux-aarch64' && 'linux-arm64-cpu8') ||
                 (inputs.host-platform == 'win-64' && 'windows-2022') ||
                 (inputs.host-platform == 'win-arm64' && 'windows-11-arm') }}
    timeout-minutes: 360
    # Linux builds in manylinux for its glibc floor; Windows on the host.
    container: ${{ (inputs.host-platform == 'linux-64' && 'quay.io/pypa/manylinux_2_28_x86_64') ||
                   (inputs.host-platform == 'linux-aarch64' && 'quay.io/pypa/manylinux_2_28_aarch64') || '' }}
    env:
      PARALLEL: "4"
      # One link at a time on the hosted Windows runners, as the WoA build did.
      LLVM_PARALLEL_LINK_JOBS: ${{ startsWith(inputs.host-platform, 'win') && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Compute LLVM params
        id: params
        run: |
          echo "key=$(bash ci/llvm-cache-key.sh llvm7 "${{ inputs.host-platform }}")" >> "$GITHUB_OUTPUT"
          echo "artifact-name=llvm7-install-${{ inputs.host-platform }}" >> "$GITHUB_OUTPUT"
          source ci/llvm-version.env
          echo "msvc-toolset=${LLVM_WINDOWS_MSVC_TOOLSET}" >> "$GITHUB_OUTPUT"

      - name: Restore or check LLVM GHA cache
        id: gha-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: llvm7-install/
          key: ${{ steps.params.outputs.key }}

      - name: Set up Python
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-hardened-python
        with:
          python-version: "3.12"

      - name: Set up MSVC
        if: ${{ steps.gha-cache.outputs.cache-hit != 'true' && startsWith(inputs.host-platform, 'win') }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
        with:
          arch: ${{ inputs.host-platform == 'win-arm64' && 'arm64' || 'x64' }}
          toolset: ${{ steps.params.outputs.msvc-toolset }}

      - name: Install build dependencies
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install pybind11 "nanobind~=2.9" numpy ninja cmake "typing-extensions; python_version < '3.12'"
          # ci/llvm-cache.sh needs the AWS CLI; the Windows runner images ship it.
          if [[ "${RUNNER_OS}" == Linux ]]; then
            python -m pip install awscli
          fi

      - name: Install sccache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-sccache

      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.gha-cache.outputs.cache-hit != 'true'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 43200

      - name: Set up sccache S3 credentials
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: bash ci/setup-sccache.sh

      - name: Build or restore LLVM from cache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          CACHE_KEY="${{ steps.params.outputs.key }}"
          echo "Cache key: ${CACHE_KEY}"
          if source ci/llvm-cache.sh && cache_download "$CACHE_KEY" llvm7-install; then
            echo "Using cached LLVM"
          else
            bash ci/build-llvm7.sh
            source ci/llvm-cache.sh && cache_upload "$CACHE_KEY" llvm7-install
          fi

      - name: Save LLVM to GHA cache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: llvm7-install/
          key: ${{ steps.params.outputs.key }}

      - name: Upload LLVM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.params.outputs.artifact-name }}
          path: llvm7-install/
          if-no-files-found: error
