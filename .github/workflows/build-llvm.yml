on:
  workflow_call:
    inputs:
      host-platform:
        required: true
        type: string
      python-versions:
        description: JSON array of Python versions (sourced from ci/versions.yml).
        required: true
        type: string

defaults:
  run:
    shell: bash --noprofile --norc -xeuo pipefail {0}

permissions:
  contents: read
  id-token: write

jobs:
  build-llvm-modern:
    name: LLVM Modern (${{ matrix.python-version }})
    if: ${{ startsWith(inputs.host-platform, 'linux') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    runs-on: ${{ (inputs.host-platform == 'linux-64' && 'linux-amd64-cpu8') ||
                 (inputs.host-platform == 'linux-aarch64' && 'linux-arm64-cpu8') }}
    timeout-minutes: 180
    container:
      image: ${{ (inputs.host-platform == 'linux-aarch64' && 'quay.io/pypa/manylinux_2_28_aarch64') ||
                  'quay.io/pypa/manylinux_2_28_x86_64' }}
    env:
      PARALLEL: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Derive the py-tag and manylinux Python interpreter path from
      # matrix.python-version. "3.14t" -> cp314t and cp314-cp314t; "3.11"
      # -> cp311 and cp311-cp311.
      - name: Compute Python tags
        run: |
          PY_VER='${{ matrix.python-version }}'
          BASE_TAG="cp${PY_VER%t}"
          BASE_TAG="${BASE_TAG//./}"
          PY_TAG="cp${PY_VER//./}"
          echo "PY_TAG=$PY_TAG" >> "$GITHUB_ENV"
          echo "PY=/opt/python/${BASE_TAG}-${PY_TAG}/bin/python" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 43200

      - name: Compute cache key
        id: cache-key
        run: |
          KEY="$(bash ci/llvm-cache-key.sh modern "${{ inputs.host-platform }}" "$PY_TAG")"
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"

      - name: Restore or check LLVM Modern GHA cache
        id: gha-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: llvm-modern-install/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Prepend manylinux Python to PATH
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: echo "$(dirname "$PY")" >> "$GITHUB_PATH"

      - name: Update pip
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/update-pip

      - name: Install build dependencies
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          "${PY}" -m pip install pybind11 "nanobind~=2.9" numpy ninja cmake awscli "typing-extensions; python_version < '3.12'"
          chmod +x ci/*.sh

      - name: Install sccache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-sccache

      - name: Set up sccache S3 credentials
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$(dirname $PY):$PATH"
          ci/setup-sccache.sh

      - name: Build or restore LLVM Modern from cache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$(dirname $PY):$PATH"
          source ci/llvm-version.env
          CACHE_KEY="${{ steps.cache-key.outputs.key }}"
          echo "Cache key: ${CACHE_KEY}"
          if source ci/llvm-cache.sh && cache_download "$CACHE_KEY" llvm-modern-install; then
            echo "Using cached LLVM"
          else
            ci/build-llvm-modern.sh
            source ci/llvm-cache.sh && cache_upload "$CACHE_KEY" llvm-modern-install
          fi

      - name: Save LLVM Modern to GHA cache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: llvm-modern-install/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Upload LLVM Modern artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: llvm-modern-install-${{ env.PY_TAG }}-${{ inputs.host-platform }}
          path: llvm-modern-install/

  build-llvm-windows:
    name: LLVM ${{ matrix.mode == 'modern' && format('Modern Windows ({0})', matrix.python-version) || '7 Windows' }}
    if: ${{ startsWith(inputs.host-platform, 'win') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
        mode: [modern]
        # LLVM 7 is built once at a fixed Python, and only for win-64 (WoA
        # has no LLVM 7 bridge).
        include: ${{ fromJSON(inputs.host-platform == 'win-64' && '[{"python-version":"3.12","mode":"llvm7"}]' || '[]') }}
    runs-on: ${{ (inputs.host-platform == 'win-64' && 'windows-2022') ||
                 (inputs.host-platform == 'win-arm64' && 'windows-11-arm') }}
    timeout-minutes: 360
    env:
      PARALLEL: "4"
      LLVM_PARALLEL_LINK_JOBS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Compute LLVM params
        id: params
        run: |
          PY_VER='${{ matrix.python-version }}'
          PY_TAG="cp${PY_VER//./}"
          source ci/llvm-version.env
          if [[ '${{ matrix.mode }}' == 'modern' ]]; then
            INSTALL_DIR=llvm-modern-install
            BUILD_SCRIPT=ci/build-llvm-modern.sh
            KEY="$(bash ci/llvm-cache-key.sh modern "${{ inputs.host-platform }}" "$PY_TAG")"
            ARTIFACT_NAME="llvm-modern-install-$PY_TAG-${{ inputs.host-platform }}"
          else
            INSTALL_DIR=llvm7-install
            BUILD_SCRIPT=ci/build-llvm7.sh
            KEY="$(bash ci/llvm-cache-key.sh llvm7 "${{ inputs.host-platform }}")"
            ARTIFACT_NAME="llvm7-install-${{ inputs.host-platform }}"
          fi
          echo "INSTALL_DIR=$INSTALL_DIR" >> "$GITHUB_ENV"
          echo "BUILD_SCRIPT=$BUILD_SCRIPT" >> "$GITHUB_ENV"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "artifact-name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "msvc-toolset=${LLVM_WINDOWS_MSVC_TOOLSET}" >> "$GITHUB_OUTPUT"

      - name: Restore or check LLVM GHA cache
        id: gha-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.INSTALL_DIR }}/
          key: ${{ steps.params.outputs.key }}

      - name: Set up Python
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-hardened-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up MSVC
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
        with:
          arch: ${{ inputs.host-platform == 'win-arm64' && 'arm64' || 'x64' }}
          toolset: ${{ steps.params.outputs.msvc-toolset }}

      # The runner images ship AWS CLI v2, which ci/llvm-cache.sh uses.
      - name: Install build dependencies
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install pybind11 "nanobind~=2.9" numpy ninja cmake "typing-extensions; python_version < '3.12'"

      - name: Install sccache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-sccache

      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.gha-cache.outputs.cache-hit != 'true'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 43200

      - name: Set up sccache S3 credentials
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: bash ci/setup-sccache.sh

      - name: Build or restore LLVM from cache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          CACHE_KEY="${{ steps.params.outputs.key }}"
          echo "Cache key: ${CACHE_KEY}"
          if source ci/llvm-cache.sh && cache_download "$CACHE_KEY" "$INSTALL_DIR"; then
            echo "Using cached LLVM"
          else
            bash "$BUILD_SCRIPT"
            source ci/llvm-cache.sh && cache_upload "$CACHE_KEY" "$INSTALL_DIR"
          fi

      - name: Save LLVM to GHA cache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.INSTALL_DIR }}/
          key: ${{ steps.params.outputs.key }}

      - name: Upload LLVM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.params.outputs.artifact-name }}
          path: ${{ env.INSTALL_DIR }}/
          if-no-files-found: error

  build-llvm7:
    name: LLVM 7
    if: ${{ startsWith(inputs.host-platform, 'linux') }}
    runs-on: ${{ (inputs.host-platform == 'linux-64' && 'linux-amd64-cpu8') ||
                 (inputs.host-platform == 'linux-aarch64' && 'linux-arm64-cpu8') }}
    timeout-minutes: 180
    container:
      image: ${{ (inputs.host-platform == 'linux-aarch64' && 'quay.io/pypa/manylinux_2_28_aarch64') ||
                  'quay.io/pypa/manylinux_2_28_x86_64' }}
    env:
      PY: /opt/python/cp312-cp312/bin/python
      PARALLEL: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 43200

      - name: Compute cache key
        id: cache-key
        run: |
          KEY="$(bash ci/llvm-cache-key.sh llvm7 "${{ inputs.host-platform }}")"
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"

      - name: Restore or check LLVM 7 GHA cache
        id: gha-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: llvm7-install/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Prepend manylinux Python to PATH
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: echo "$(dirname "$PY")" >> "$GITHUB_PATH"

      - name: Update pip
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/update-pip

      - name: Install build dependencies
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          "${PY}" -m pip install pybind11 "nanobind~=2.9" numpy ninja cmake awscli
          chmod +x ci/*.sh

      - name: Install sccache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-sccache

      - name: Set up sccache S3 credentials
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$(dirname $PY):$PATH"
          ci/setup-sccache.sh

      - name: Build or restore LLVM 7 from cache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$(dirname $PY):$PATH"
          source ci/llvm-version.env
          CACHE_KEY="${{ steps.cache-key.outputs.key }}"
          echo "Cache key: ${CACHE_KEY}"
          if source ci/llvm-cache.sh && cache_download "$CACHE_KEY" llvm7-install; then
            echo "Using cached LLVM 7"
          else
            ci/build-llvm7.sh
            source ci/llvm-cache.sh && cache_upload "$CACHE_KEY" llvm7-install
          fi

      - name: Save LLVM 7 to GHA cache
        if: steps.gha-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: llvm7-install/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Upload LLVM 7 artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: llvm7-install-${{ inputs.host-platform }}
          path: llvm7-install/
