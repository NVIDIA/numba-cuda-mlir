name: Ecosystem compatibility

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci-vars:
    if: ${{ github.repository_owner == 'nvidia' }}
    runs-on: ubuntu-latest
    outputs:
      CUDA_BUILD_VER: ${{ steps.get-vars.outputs.cuda_build_ver }}
      CUDA_PREV_BUILD_VER: ${{ steps.get-vars.outputs.cuda_prev_build_ver }}
      PYTHON_VERSIONS: ${{ steps.get-vars.outputs.python_versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Get CUDA + Python build versions
        id: get-vars
        run: |
          cuda_build_ver=$(yq '.cuda.build.version' ci/versions.yml)
          echo "cuda_build_ver=$cuda_build_ver" >> $GITHUB_OUTPUT
          cuda_prev_build_ver=$(yq '.cuda.prev_build.version' ci/versions.yml)
          echo "cuda_prev_build_ver=$cuda_prev_build_ver" >> $GITHUB_OUTPUT

          # Flattened one-line JSON for pass-through to build-wheel.yml /
          # build-llvm.yml via fromJSON on the receiving side.
          python_versions=$(yq -o json -I 0 '.python.supported' ci/versions.yml)
          echo "python_versions=$python_versions" >> $GITHUB_OUTPUT

  build-llvm-linux-64:
    needs:
      - ci-vars
    uses: ./.github/workflows/build-llvm.yml
    with:
      host-platform: linux-64
      python-versions: ${{ needs.ci-vars.outputs.PYTHON_VERSIONS }}
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  build-llvm-linux-aarch64:
    needs:
      - ci-vars
    uses: ./.github/workflows/build-llvm.yml
    with:
      host-platform: linux-aarch64
      python-versions: ${{ needs.ci-vars.outputs.PYTHON_VERSIONS }}
    permissions:
      contents: read
      id-token: write
    secrets: inherit


  build-linux-64:
    needs: [ci-vars, build-llvm-linux-64]
    uses: ./.github/workflows/build-wheel.yml
    with:
      host-platform: linux-64
      python-versions: ${{ needs.ci-vars.outputs.PYTHON_VERSIONS }}
      cuda-version: ${{ needs.ci-vars.outputs.CUDA_BUILD_VER }}
      prev-cuda-version: ${{ needs.ci-vars.outputs.CUDA_PREV_BUILD_VER }}

  build-linux-aarch64:
    needs: [ci-vars, build-llvm-linux-aarch64]
    uses: ./.github/workflows/build-wheel.yml
    with:
      host-platform: linux-aarch64
      python-versions: ${{ needs.ci-vars.outputs.PYTHON_VERSIONS }}
      cuda-version: ${{ needs.ci-vars.outputs.CUDA_BUILD_VER }}
      prev-cuda-version: ${{ needs.ci-vars.outputs.CUDA_PREV_BUILD_VER }}

  test-cudf-source-linux-64:
    name: cudf source Test linux-64
    permissions:
      contents: read
    needs:
      - build-linux-64
    uses: ./.github/workflows/test-cudf-source-linux.yml
    with:
      host-platform: linux-64

  test-cudf-source-linux-aarch64:
    name: cudf source Test linux-aarch64
    permissions:
      contents: read
    needs:
      - build-linux-aarch64
    uses: ./.github/workflows/test-cudf-source-linux.yml
    with:
      host-platform: linux-aarch64

  test-numbast-mlir-linux-64:
    name: Numbast MLIR Test linux-64
    permissions:
      contents: read
    needs:
      - build-linux-64
    uses: ./.github/workflows/test-numbast-mlir-linux.yml
    with:
      host-platform: linux-64

  test-numbast-mlir-linux-aarch64:
    name: Numbast MLIR Test linux-aarch64
    permissions:
      contents: read
    needs:
      - build-linux-aarch64
    uses: ./.github/workflows/test-numbast-mlir-linux.yml
    with:
      host-platform: linux-aarch64

  test-nvmath-python-mlir-linux-64:
    name: nvmath-python MLIR Test linux-64
    permissions:
      contents: read
    needs:
      - build-linux-64
    uses: ./.github/workflows/test-nvmath-python-mlir-linux.yml
    with:
      host-platform: linux-64

  test-nvmath-python-mlir-linux-aarch64:
    name: nvmath-python MLIR Test linux-aarch64
    permissions:
      contents: read
    needs:
      - build-linux-aarch64
    uses: ./.github/workflows/test-nvmath-python-mlir-linux.yml
    with:
      host-platform: linux-aarch64

  test-cccl-compute-mlir-linux-64:
    name: CCCL cuda.compute MLIR Test linux-64
    permissions:
      contents: read
    needs:
      - build-linux-64
    uses: ./.github/workflows/test-cccl-compute-mlir-linux.yml
    with:
      host-platform: linux-64

  test-cccl-compute-mlir-linux-aarch64:
    name: CCCL cuda.compute MLIR Test linux-aarch64
    permissions:
      contents: read
    needs:
      - build-linux-aarch64
    uses: ./.github/workflows/test-cccl-compute-mlir-linux.yml
    with:
      host-platform: linux-aarch64

  checks:
    name: Ecosystem job status
    if: ${{ always() && github.repository_owner == 'nvidia' }}
    runs-on: ubuntu-latest
    needs:
      - ci-vars
      - build-llvm-linux-64
      - build-llvm-linux-aarch64
      - build-linux-64
      - build-linux-aarch64
      - test-cudf-source-linux-64
      - test-cudf-source-linux-aarch64
      - test-numbast-mlir-linux-64
      - test-numbast-mlir-linux-aarch64
      - test-nvmath-python-mlir-linux-64
      - test-nvmath-python-mlir-linux-aarch64
      - test-cccl-compute-mlir-linux-64
      - test-cccl-compute-mlir-linux-aarch64
    steps:
      - name: Check build and library test results
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$JOB_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Skipped tests after an upstream build failure must not pass this gate.
          echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
