name: Ecosystem compatibility

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      run-id:
        description: 'ci.yaml run whose wheels to test (default: latest successful main push run)'
        required: false
        type: string
      producer-branch:
        description: 'Branch for the default lookup, e.g. pull-request/461 (ignored when run-id is set)'
        required: false
        type: string
        default: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.run-id || 'default' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  find-wheels:
    if: ${{ github.repository_owner == 'nvidia' }}
    runs-on: ubuntu-latest
    outputs:
      RUN_ID: ${{ steps.find.outputs.run_id }}
      HEAD_SHA: ${{ steps.find.outputs.head_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve wheel producer run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_RUN_ID: ${{ inputs.run-id }}
          INPUT_BRANCH: ${{ inputs.producer-branch || 'main' }}
        run: |
          if [[ -n "$INPUT_RUN_ID" ]]; then
            # Explicit override: accept any completed ci.yaml run in this
            # repository, including one on a pull-request/<N> branch. The
            # nightly path stays strict about main + success so the scheduled
            # signal is unchanged.
            if [[ ! "$INPUT_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::run-id must be a positive integer, got '$INPUT_RUN_ID'"
              exit 1
            fi
            RUN_DATA=$(gh api "repos/$GH_REPO/actions/runs/$INPUT_RUN_ID")
            jq -e --arg repo "$GH_REPO" '
              ((.repository.full_name // "") | ascii_downcase) == ($repo | ascii_downcase)
              and ((.path // "") | endswith("/ci.yaml"))
            ' <<< "$RUN_DATA" >/dev/null || {
              echo "::error::Run $INPUT_RUN_ID is not a ci.yaml run of $GH_REPO"
              exit 1
            }
            STATUS=$(jq -r '.status' <<< "$RUN_DATA")
            if [[ "$STATUS" != "completed" ]]; then
              echo "::error::Run $INPUT_RUN_ID is '$STATUS'; wait for it to finish so artifacts are fully uploaded"
              exit 1
            fi
            RUN_ID="$INPUT_RUN_ID"
            HEAD_SHA=$(jq -r '.head_sha' <<< "$RUN_DATA")
            PRODUCER_BRANCH=$(jq -r '.head_branch' <<< "$RUN_DATA")
            PRODUCER_EVENT=$(jq -r '.event' <<< "$RUN_DATA")
            PRODUCER_CONCLUSION=$(jq -r '.conclusion' <<< "$RUN_DATA")
            if [[ "$PRODUCER_CONCLUSION" != "success" ]]; then
              echo "::warning::Producer run $RUN_ID concluded '$PRODUCER_CONCLUSION'; its wheels are incomplete or untested"
            fi
          else
            RUN=$(./ci/tools/lookup-run-id --branch "$INPUT_BRANCH" --event push --head-sha \
              "$GH_REPO" ci.yaml)
            RUN_ID=$(sed -n '1p' <<< "$RUN")
            HEAD_SHA=$(sed -n '2p' <<< "$RUN")
            PRODUCER_BRANCH="$INPUT_BRANCH"
            PRODUCER_EVENT=push
            PRODUCER_CONCLUSION=success
          fi

          RUN_URL="${{ github.server_url }}/$GH_REPO/actions/runs/$RUN_ID"
          echo "Selected wheel producer: $RUN_URL"
          echo "Producer SHA: $HEAD_SHA"
          echo "Producer branch: $PRODUCER_BRANCH ($PRODUCER_EVENT, $PRODUCER_CONCLUSION)"
          printf '### Ecosystem wheel producer\n\n- Run: %s\n- SHA: `%s`\n- Branch: `%s` (%s, %s)\n' \
            "$RUN_URL" "$HEAD_SHA" "$PRODUCER_BRANCH" "$PRODUCER_EVENT" "$PRODUCER_CONCLUSION" \
            >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PRODUCER_BRANCH" != "main" ]]; then
            printf '\n> Manual run against a non-main producer: not nightly compatibility evidence.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

  test-cudf-source-linux-64:
    name: cudf source Test linux-64
    permissions:
      contents: read
      actions: read
    needs:
      - find-wheels
    uses: ./.github/workflows/test-cudf-source-linux.yml
    with:
      host-platform: linux-64
      run-id: ${{ needs.find-wheels.outputs.RUN_ID }}
      sha: ${{ needs.find-wheels.outputs.HEAD_SHA }}

  test-cudf-source-linux-aarch64:
    name: cudf source Test linux-aarch64
    permissions:
      contents: read
      actions: read
    needs:
      - find-wheels
    uses: ./.github/workflows/test-cudf-source-linux.yml
    with:
      host-platform: linux-aarch64
      run-id: ${{ needs.find-wheels.outputs.RUN_ID }}
      sha: ${{ needs.find-wheels.outputs.HEAD_SHA }}

  test-numbast-mlir-linux-64:
    name: Numbast MLIR Test linux-64
    permissions:
      contents: read
      actions: read
    needs:
      - find-wheels
    uses: ./.github/workflows/test-numbast-mlir-linux.yml
    with:
      host-platform: linux-64
      run-id: ${{ needs.find-wheels.outputs.RUN_ID }}
      sha: ${{ needs.find-wheels.outputs.HEAD_SHA }}

  test-numbast-mlir-linux-aarch64:
    name: Numbast MLIR Test linux-aarch64
    permissions:
      contents: read
      actions: read
    needs:
      - find-wheels
    uses: ./.github/workflows/test-numbast-mlir-linux.yml
    with:
      host-platform: linux-aarch64
      run-id: ${{ needs.find-wheels.outputs.RUN_ID }}
      sha: ${{ needs.find-wheels.outputs.HEAD_SHA }}

  test-nvmath-python-mlir-linux-64:
    name: nvmath-python MLIR Test linux-64
    permissions:
      contents: read
      actions: read
    needs:
      - find-wheels
    uses: ./.github/workflows/test-nvmath-python-mlir-linux.yml
    with:
      host-platform: linux-64
      run-id: ${{ needs.find-wheels.outputs.RUN_ID }}
      sha: ${{ needs.find-wheels.outputs.HEAD_SHA }}

  test-nvmath-python-mlir-linux-aarch64:
    name: nvmath-python MLIR Test linux-aarch64
    permissions:
      contents: read
      actions: read
    needs:
      - find-wheels
    uses: ./.github/workflows/test-nvmath-python-mlir-linux.yml
    with:
      host-platform: linux-aarch64
      run-id: ${{ needs.find-wheels.outputs.RUN_ID }}
      sha: ${{ needs.find-wheels.outputs.HEAD_SHA }}

  test-cccl-compute-mlir-linux-64:
    name: CCCL cuda.compute MLIR Test linux-64
    permissions:
      contents: read
      actions: read
    needs:
      - find-wheels
    uses: ./.github/workflows/test-cccl-compute-mlir-linux.yml
    with:
      host-platform: linux-64
      run-id: ${{ needs.find-wheels.outputs.RUN_ID }}
      sha: ${{ needs.find-wheels.outputs.HEAD_SHA }}

  test-cccl-compute-mlir-linux-aarch64:
    name: CCCL cuda.compute MLIR Test linux-aarch64
    permissions:
      contents: read
      actions: read
    needs:
      - find-wheels
    uses: ./.github/workflows/test-cccl-compute-mlir-linux.yml
    with:
      host-platform: linux-aarch64
      run-id: ${{ needs.find-wheels.outputs.RUN_ID }}
      sha: ${{ needs.find-wheels.outputs.HEAD_SHA }}

  checks:
    name: Ecosystem job status
    if: ${{ always() && github.repository_owner == 'nvidia' }}
    runs-on: ubuntu-latest
    needs:
      - find-wheels
      - test-cudf-source-linux-64
      - test-cudf-source-linux-aarch64
      - test-numbast-mlir-linux-64
      - test-numbast-mlir-linux-aarch64
      - test-nvmath-python-mlir-linux-64
      - test-nvmath-python-mlir-linux-aarch64
      - test-cccl-compute-mlir-linux-64
      - test-cccl-compute-mlir-linux-aarch64
    steps:
      - name: Check wheel producer and library test results
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$JOB_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Skipped tests after an unavailable wheel producer must not pass this gate.
          echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
